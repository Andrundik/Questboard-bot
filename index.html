<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quest Board</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            font-family: sans-serif;
            margin: 0;
            padding: 15px 15px 80px 15px;
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            font-size: 22px;
            margin-bottom: 15px;
        }

        /* Блок билетов */
        .tickets-card {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            padding: 12px;
            border-radius: 16px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* Центральная зона (Колесо) */
        .wheel-container {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            height: 140px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            font-size: 14px;
            opacity: 0.8;
        }

        /* Кнопки улучшений */
        .upgrades-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .upgrade-card {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            padding: 12px;
            border-radius: 14px;
            text-align: center;
            cursor: pointer;
        }

        .upgrade-card div:first-child {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .upgrade-card div:last-child {
            font-size: 12px;
            opacity: 0.7;
        }

        /* Заголовки разделов */
        .section-title {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 10px;
            text-align: left;
        }

        /* Секция квестов (вертикальный скролл) */
        .quests-container {
            max-height: 220px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 4px;
        }

        /* Карточка квеста */
        .quest-item {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            padding: 10px 12px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            cursor: pointer;
        }

        .quest-info {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-grow: 1;
            overflow: hidden;
        }

        /* Аватарки */
        .quest-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: #ccc;
            object-fit: cover;
            flex-shrink: 0;
        }

        .quest-title {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .quest-reward {
            background-color: var(--tg-theme-button-color, #ff6600);
            color: var(--tg-theme-button-text-color, #ffffff);
            padding: 5px 10px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
        }

        /* Нижнее меню */
        .tabbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--tg-theme-bg-color, #ffffff);
            border-top: 1px solid rgba(128, 128, 128, 0.2);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            max-width: 480px;
            margin: 0 auto;
        }

        .tab-item {
            font-size: 22px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Quest Board</h1>

    <!-- Баланс -->
    <div class="tickets-card">
        🎟 Билетов: <span id="tickets-count">0</span>
    </div>

    <!-- Колесо -->
    <div class="wheel-container">
        🎡 Колесо фортуны
    </div>

    <!-- Улучшения -->
    <div class="upgrades-grid">
        <div class="upgrade-card" onclick="buyUpgrade('Убрать рекламу')">
            <div>Убрать рекламу</div>
            <div>50 🪙</div>
        </div>
        <div class="upgrade-card" onclick="buyUpgrade('Быстрые крутки')">
            <div>Быстрые крутки</div>
            <div>25 🪙</div>
        </div>
    </div>

    <!-- Квесты -->
    <div class="section-title">📌 Подписаться на каналы</div>
    <div class="quests-container">
        <div class="quest-item" onclick="completeQuest('https://t.me/durov', 'Крипто Новости UA')">
            <div class="quest-info">
                <img src="https://via.placeholder.com/40" alt="avatar" class="quest-avatar">
                <div class="quest-title">Крипто Новости UA</div>
            </div>
            <div class="quest-reward">+1 🎟</div>
        </div>

        <div class="quest-item" onclick="completeQuest('https://t.me/durov', 'Геймеры Telegram')">
            <div class="quest-info">
                <img src="https://via.placeholder.com/40" alt="avatar" class="quest-avatar">
                <div class="quest-title">Геймеры Telegram</div>
            </div>
            <div class="quest-reward">+2 🎟</div>
        </div>

        <div class="quest-item" onclick="completeQuest('https://t.me/durov', 'Раздача TON')">
            <div class="quest-info">
                <img src="https://via.placeholder.com/40" alt="avatar" class="quest-avatar">
                <div class="quest-title">Раздача TON</div>
            </div>
            <div class="quest-reward">+1 🎟</div>
        </div>
    </div>

    <!-- Нижнее меню -->
    <div class="tabbar">
        <span class="tab-item" onclick="switchTab('home')">🏠</span>
        <span class="tab-item" onclick="switchTab('wheel')">🎡</span>
        <span class="tab-item" onclick="switchTab('cup')">🏆</span>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.ready();

        function completeQuest(channelUrl, questName) {
            if (window.Telegram && window.Telegram.WebApp) {
                // Открываем канал для подписки
                tg.openTelegramLink(channelUrl);
                // Тихо отправляем боту сигнал на проверку подписки
                tg.sendData('CHECK_SUB:' + questName);
            } else {
                window.open(channelUrl, '_blank');
            }
        }

        function buyUpgrade(name) {
            console.log("Покупка: " + name);
        }

        function switchTab(tab) {
            console.log("Вкладка: " + tab);
        }
    </script>
</body>
</html>
