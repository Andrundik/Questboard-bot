<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quest Board</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            font-family: sans-serif;
            margin: 0;
            padding: 15px 15px 80px 15px;
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            font-size: 22px;
            margin-bottom: 15px;
        }

        .tickets-card {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            padding: 12px;
            border-radius: 16px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .wheel-container {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            height: 140px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            font-size: 14px;
            opacity: 0.8;
        }

        .section-title {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 10px;
            text-align: left;
        }

        .quests-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .quest-item {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            padding: 10px 12px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .quest-info {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-grow: 1;
            overflow: hidden;
        }

        .quest-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: #ccc;
            object-fit: cover;
            flex-shrink: 0;
        }

        .quest-title {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Кнопка квеста, которая меняет состояние */
        .quest-btn {
            background-color: var(--tg-theme-button-color, #ff6600);
            color: var(--tg-theme-button-text-color, #ffffff);
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            white-space: nowrap;
        }

        .quest-btn.checked {
            background-color: #4caf50;
        }
    </style>
</head>
<body>

    <h1>Quest Board</h1>

    <div class="tickets-card">
        🎟 Билетов: <span id="tickets-count">0</span>
    </div>

    <div class="wheel-container">
        🎡 Колесо фортуны
    </div>

    <div class="section-title">📌 Подписаться на каналы</div>
    <div class="quests-container">
        <div class="quest-item" id="quest-1">
            <div class="quest-info">
                <img src="https://via.placeholder.com/40" alt="avatar" class="quest-avatar">
                <div class="quest-title">Канал Крипто Новости</div>
            </div>
            <button class="quest-btn" id="btn-1" onclick="handleQuestClick('https://t.me/durov', 'btn-1')">Выполнить</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.ready();

        // Состояние квеста для каждого блока: 'subscribe' -> 'check' -> 'done'
        let questState = 'subscribe'; 

        function handleQuestClick(channelUrl, btnId) {
            let btn = document.getElementById(btnId);

            if (questState === 'subscribe') {
                // 1. Шаг: Пользователь кликает "Выполнить" -> открывается канал, окно сворачивается/не закрывается
                tg.openTelegramLink(channelUrl);
                
                // Меняем кнопку на "Проверить"
                questState = 'check';
                btn.innerText = "Проверить";
                btn.style.backgroundColor = "#2196F3"; // Синий цвет для проверки
                
            } else if (questState === 'check') {
                // 2. Шаг: Пользователь вернулся и нажал "Проверить" -> делаем запрос к боту
                btn.innerText = "Проверка...";
                
                fetch('/check_sub', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: tg.initDataUnsafe.user.id })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        // Успех! Подписка подтверждена
                        questState = 'done';
                        btn.innerText = "Готово ✔";
                        btn.classList.add('checked');
                        btn.disabled = true;
                        
                        // Обновляем баланс на экране
                        document.getElementById('tickets-count').innerText = data.tickets;
                        tg.showAlert("🎉 Поздравляем! Вам начислен 1 билет.");
                    } else {
                        // Если еще не подписался
                        btn.innerText = "Проверить";
                        tg.showAlert("❌ Вы еще не подписались на канал!");
                    }
                })
                .catch(error => {
                    btn.innerText = "Проверить";
                    tg.showAlert("⚠️ Ошибка соединения с сервером.");
                });
            }
        }
    </script>
</body>
</html>
